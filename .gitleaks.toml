# gitleaks config. Leapfrog L3, 2026-08-09; installed here by CLOUD-P1, 2026-08-17.
#
# What this is for, in one sentence: a credential that reaches a GitHub repo is scraped within
# minutes of the repo going public, and until now nothing here looked for one at commit time.
#
# useDefault pulls in gitleaks' whole built-in rule set (Supabase JWTs, sb_secret_ keys, AWS,
# Anthropic, OpenAI, GitHub tokens, generic high-entropy assignments, ~170 rules). Do not replace
# it with a hand-written list; the point of a scanner is that it knows shapes you have not thought of.
[extend]
useDefault = true

# ---------------------------------------------------------------------------------------------
# Allowlist. Read this before adding to it.
#
# The ONLY things allowlisted here are paths that cannot hold a live credential by construction:
# lockfiles (transitive hashes, no secrets) and *.example files (deliberate placeholders).
#
# Do NOT allowlist "the file that has the browser key in it". A sibling repo did the moral
# equivalent, and a SERVICE-ROLE key was later committed into that same file and waved straight
# through. The scan is on the staged diff, so an untouched publishable-key line never fires
# anyway. If you genuinely need to re-commit one, use a `gitleaks:allow` comment on that line or
# a fingerprint in .gitleaksignore — both leave a reviewable trace.
# ---------------------------------------------------------------------------------------------
[[allowlists]]
description = "Lockfiles and deliberate placeholder files"
paths = [
  '''package-lock\.json$''',
  '''(^|/)deno\.lock$''',
  '''\.example$''',
  '''\.env[^/]*\.example$''',
]
