<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wonder Cards, today's tile as the card route would draw it</title>
<!--
  TILEVALUE1, 2026-11-07, round 4. Wonder Cards here is the kids deck Whit meant ("the one that's geared
  towards kids not the adult one"): "What Should We Wonder?", live at https://wondercards-teal.vercel.app,
  60 tap-to-draw question and activity cards for little kids. It is not in src/data/tools.ts, so
  /api/og/tool/<slug> cannot draw its tile. This page draws it the way src/lib/brand/tool-card.ts lays out
  every other tile (1200 by 630, 72 padding, the name at 112px, line height 1.02, tracking -0.02em, the
  280 picture beside it) with the 'cards' picture of src/data/tool-pictures.ts, in the deck's own look read
  from its live page on 2026-11-07: its name on the home screen "Wonder Cards" (apple-mobile-web-app-title),
  its display face Fredoka 600, its blueberry ink #3B3560, its tangerine #FFAA5C and its card face
  #FFFDF8. The ground is the blueberry of its own app icon, not its page's icing #FFF4E4, which is a cream
  and is not used on Hoplight. Rendered to a PNG by capture.mjs (job wondertoday).
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=block">
<style>
html, body { margin: 0; }
.card { width: 1200px; height: 630px; box-sizing: border-box; padding: 0 72px; background: #3B3560; display: flex; align-items: center; justify-content: space-between; }
.name { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 112px; line-height: 1.02; letter-spacing: -0.02em; color: #FFFFFF; }
svg { width: 280px; height: 280px; flex: none; }
</style>
</head>
<body>
<div class="card">
  <div class="name">Wonder<br>Cards</div>
  <svg viewBox="0 0 280 280" aria-hidden="true">
    <rect x="62" y="44" width="156" height="204" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4" transform="rotate(-9 140 146)"/>
    <rect x="62" y="40" width="156" height="204" rx="18" fill="#FFAA5C" transform="rotate(5 140 142)"/>
    <rect x="92" y="96" width="96" height="10" rx="5" fill="#3B3560" fill-opacity="0.85" transform="rotate(5 140 142)"/>
    <rect x="92" y="122" width="64" height="10" rx="5" fill="#3B3560" fill-opacity="0.55" transform="rotate(5 140 142)"/>
  </svg>
</div>
</body>
</html>
