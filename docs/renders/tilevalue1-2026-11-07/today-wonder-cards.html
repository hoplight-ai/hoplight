<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wonder Cards, today's tile as the card route would draw it</title>
<!--
  TILEVALUE1, 2026-11-07. Wonder Cards is not in src/data/tools.ts, so /api/og/tool/<slug> cannot draw its
  tile. This page draws it the way src/lib/brand/tool-card.ts lays out every other tile (1200 by 630,
  72 padding, the name at 112px, line height 1.02, tracking -0.02em, the 280 picture beside it) and
  src/data/tool-pictures.ts draws the 'cards' picture, with Wonder Cards' own look read from
  wonder-cards.vercel.app on 2026-11-07: its default panel colour #005A63 (its theme-color), the Screen
  topic's awning coral #FF7D64, and its display face Playfair Display. Rendered to a PNG by capture.mjs.
-->
<style>
@font-face { font-family: 'Playfair Display'; src: url('../../../public/fonts/playfair-display-latin-700-normal.woff2') format('woff2'); font-weight: 700; }
html, body { margin: 0; }
.card { width: 1200px; height: 630px; box-sizing: border-box; padding: 0 72px; background: #005A63; display: flex; align-items: center; justify-content: space-between; }
.name { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 112px; line-height: 1.02; letter-spacing: -0.02em; color: #FFFFFF; }
svg { width: 280px; height: 280px; flex: none; }
</style>
</head>
<body>
<div class="card">
  <div class="name">Wonder<br>Cards</div>
  <svg viewBox="0 0 280 280" aria-hidden="true">
    <rect x="62" y="44" width="156" height="204" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4" transform="rotate(-9 140 146)"/>
    <rect x="62" y="40" width="156" height="204" rx="18" fill="#FF7D64" transform="rotate(5 140 142)"/>
    <rect x="92" y="96" width="96" height="10" rx="5" fill="#005A63" fill-opacity="0.85" transform="rotate(5 140 142)"/>
    <rect x="92" y="122" width="64" height="10" rx="5" fill="#005A63" fill-opacity="0.55" transform="rotate(5 140 142)"/>
  </svg>
</div>
</body>
</html>
