<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Which AI, three roots drawings side by side</title>
<!--
  TILEVALUE1 round 4, 2026-11-07. Whit: "we need to find a better graphic visualization of the which model
  should I pick like maybe it's diverging roots or something". Three drawings of one stem splitting, each
  at the tile's full 280 box and at 78px (the box's size on a 390 phone tile). The lane keeps one.
  A: a fork, one stem splitting into three, the chosen end filled.
  B: plant roots, a sprout above a ground line, the root splitting twice below, one path to a tip in ink.
  C: sideways, one stem from the left splitting into three, the chosen branch in ink.
-->
<style>

.big { width: 280px; height: 280px; border: 1px solid #DDD; }
.sm { width: 78px; height: 78px; border: 1px solid #DDD; }
</style>
</head>
<body>
<div class="row" id="r"></div>
<script>

  + '<path d="M140 92 C140 70 132 58 112 48 C126 44 138 52 140 66 C142 46 156 36 176 38 C168 54 154 62 140 70" fill="#0F1B2D"/>'
