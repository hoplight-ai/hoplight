<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>The Undo List, direction C: the database</title>
<meta name="description" content="Mockup: thirteen signatures undo 275 executive actions, led by the sortable table of every action with the thirteen orders as one bar across the top.">
<meta property="og:title" content="The Undo List, direction C: the database">
<meta property="og:description" content="Mockup: every action in one sortable table, the thirteen orders as one bar across the top.">
<meta property="og:image" content="https://hoplight.ai/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="apple-mobile-web-app-title" content="Undo database">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/manifest.webmanifest">
<!--
  UNDOMOCK1, direction C, the database. 2026-11-17. Whit: "the marvel of this is the bundling of EOs,
  the strategic message framing, and the tools encyclopedia of signed things to undo- available in a
  filterable sortable database".
  References (references/REFERENCES.md): Linear, the real product is the hero, dense inside and empty
  around it, cropped at the bottom edge so you want the rest; Stripe, one real number that changes
  while you watch (the count of actions shown moves as a filter is pressed).
  Signature element: the one bar of the thirteen orders across the top, each piece as long as its count.
  Proposals: the twelve frame names other than "America isn't a quitter", and the issue hues.
-->
<style>
@font-face { font-family: 'Inter'; src: url('/fonts/inter-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
:root { --ink: #0F1B2D; --ink2: #3A4A63; --gold: #D4950A; --gold-deep: #996D00; --line: #E3E7EE; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: #fff; color: var(--ink); font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums lining-nums; }
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 64px; }
header.site { height: 56px; display: flex; align-items: center; }
.mark { font-size: 15px; font-weight: 600; color: var(--ink); text-decoration: none; }
.hero { display: flex; align-items: center; justify-content: space-between; gap: 32px; padding: 4px 0 20px; }
h1 { font-size: 44px; line-height: 1.1; font-weight: 600; letter-spacing: -0.015em; text-wrap: balance; }
.btn { font: inherit; font-size: 15px; font-weight: 600; border-radius: 8px; padding: 14px 22px; cursor: pointer; white-space: nowrap; }
.btn-primary { background: var(--ink); color: #fff; border: 0; }
.btn-primary:hover { background: var(--gold); color: var(--ink); }
.btn:focus-visible, .seg:focus-visible, .bar:focus-visible, th button:focus-visible, .sign:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--gold); }

#orders { display: flex; gap: 2px; height: 80px; }
.seg { position: relative; border: 0; font: inherit; text-align: left; cursor: pointer; padding: 7px 8px; overflow: hidden; border-radius: 3px; min-width: 0; }
.seg b { display: block; font-size: 13px; font-weight: 600; line-height: 1.2; overflow: hidden; overflow-wrap: normal; max-height: 47px; }
.seg span { display: block; font-size: 13px; line-height: 1.2; margin-top: 3px; }
.seg[aria-pressed="true"] { box-shadow: inset 0 0 0 3px var(--gold); }
.seg.dim { opacity: .3; }

.db { display: grid; grid-template-columns: 1fr 300px; gap: 48px; margin-top: 24px; align-items: start; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; border-bottom: 2px solid var(--ink); padding: 0; }
th button, th span { font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: none; border: 0; padding: 8px 8px 8px 0; cursor: pointer; display: inline-block; }
th button[aria-sort]::after { content: ' \2193'; }
th button[aria-sort="ascending"]::after { content: ' \2191'; }
td { padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 15px; }
td.f, td.who, td.k, td.d { font-size: 13px; padding-top: 10px; }
td.who { white-space: nowrap; }
td.who i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
td.d { white-space: nowrap; }
.sign { font: inherit; font-size: 13px; font-weight: 600; color: var(--gold-deep); background: none; border: 0; cursor: pointer; padding: 0; }

aside h3 { font-size: 13px; font-weight: 600; padding: 8px 0; border-bottom: 2px solid var(--ink); margin-bottom: 8px; }
aside h3 em { font-style: normal; font-weight: 400; }
.bar { display: block; width: 100%; background: none; border: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; padding: 4px 0; border-radius: 4px; }
.bar span.l { display: block; font-size: 13px; }
.bar span.t { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.bar span.t b { display: block; height: 8px; border-radius: 2px; }
.bar span.t em { font-style: normal; font-size: 13px; }
.bar[aria-pressed="true"] span.l { font-weight: 600; }
.foot { height: 96px; }

@media (max-width: 760px) {
  .wrap { padding: 0 16px; }
  header.site { height: 48px; }
  .hero { flex-direction: column; align-items: stretch; gap: 16px; padding: 4px 0 16px; }
  h1 { font-size: 30px; }
  .btn-primary { width: 100%; }
  #orders { height: 44px; gap: 1px; }
  .seg { padding: 4px 3px; }
  .seg b { display: none; }
  .seg span { margin-top: 0; text-align: center; overflow: hidden; }
  .db { display: flex; flex-direction: column-reverse; gap: 16px; margin-top: 12px; }
  aside h3 { display: none; }
  aside { min-width: 0; max-width: 100%; }
  #bars { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; max-width: 100%; }
  .bar { flex: 0 0 auto; width: auto; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  .bar span.t b { display: none; }
  .bar span.t { display: inline; margin: 0 0 0 6px; }
  .bar span.l { display: inline; }
  .bar[aria-pressed="true"] { border-color: var(--ink); }
  table thead { display: none; }
  table, tbody, tr, td { display: block; }
  tr { border-bottom: 1px solid var(--line); padding: 10px 0; position: relative; padding-right: 48px; }
  td { border: 0; padding: 0; }
  td.who { display: block; padding: 4px 0 0; }
  td.f { display: block; padding: 0; color: var(--ink2); }
  td.k, td.d { display: none; }
  td.s { position: absolute; right: 0; top: 10px; }
}
</style>
</head>
<body>
<header class="site wrap"><a class="mark" href="/">Hoplight</a></header>
<main class="wrap">
  <section class="hero">
    <h1>Thirteen signatures undo 275 executive actions.</h1>
    <button class="btn btn-primary" type="button">Sign all thirteen</button>
  </section>
  <div id="orders" role="group" aria-label="The thirteen signing orders, each as long as the actions it undoes"></div>
  <div class="db">
    <table>
      <thead><tr>
        <th><button type="button" data-k="1">Action</button></th>
        <th><button type="button" data-k="0">Order</button></th>
        <th><button type="button" data-k="2">Who feels it</button></th>
        <th><button type="button" data-k="3">Kind</button></th>
        <th><button type="button" data-k="4" aria-sort="descending">Signed</button></th>
        <th><span>Sign</span></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <aside>
      <h3>Who feels it <em id="shown">275 shown</em></h3>
      <div id="bars"></div>
    </aside>
  </div>
  <div class="foot"></div>
</main>
<script src="undo-data.js"></script>
<script>
(function () {
  const U = window.UNDO;
  const HUE = Object.fromEntries(U.issues.map((x) => [x[0], x[2]]));
  const LABEL = Object.fromEntries(U.issues.map((x) => [x[0], x[1]]));
  const LIGHT = new Set(['paycheck', 'farms-rural', 'science', 'lgbtq', 'women', 'veterans', 'health', 'schools']);
  let on = null, order = null;

  function top(i) {
    const c = {};
    for (const x of U.rows) if (x[0] === i) c[x[2]] = (c[x[2]] || 0) + 1;
    return Object.keys(c).sort((a, b) => c[b] - c[a])[0];
  }

  function orders() {
    const total = U.rows.length;
    const list = U.orders.map((o, i) => ({ o, i })).sort((a, b) => b.o.n - a.o.n);
    const el = document.getElementById('orders');
    el.innerHTML = list.map(({ o, i }, k) => {
      const hue = top(i);
      const fg = LIGHT.has(hue) || hue === 'prices' ? '#0F1B2D' : '#fff';
      return `<button class="seg" type="button" aria-pressed="false" data-o="${i}" title="${o.frame}: ${o.n} actions. ${o.line}" style="flex:${o.n} 1 0;background:${HUE[hue]};color:${fg}"><b>${o.frame}</b><span>${o.n}${k === 0 ? ' actions' : ''}</span></button>`;
    }).join('');
    el.addEventListener('click', (e) => {
      const b = e.target.closest('.seg'); if (!b) return;
      order = order === b.dataset.o ? null : b.dataset.o;
      el.querySelectorAll('.seg').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.o === order)));
      table();
    });
    // A name shows only where it fits; the rest carry their count and open on a tap.
    requestAnimationFrame(() => el.querySelectorAll('.seg b, .seg span').forEach((b) => { if (b.scrollWidth > b.clientWidth + 1 || b.scrollHeight > b.clientHeight + 1) b.style.visibility = 'hidden'; }));
  }

  function bars() {
    const counts = {};
    for (const r of U.rows) counts[r[2]] = (counts[r[2]] || 0) + 1;
    const max = Math.max(...Object.values(counts));
    const keys = U.issues.map((x) => x[0]).sort((a, b) => counts[b] - counts[a]);
    const el = document.getElementById('bars');
    el.innerHTML = keys.map((k) => `<button class="bar" type="button" aria-pressed="false" data-i="${k}"><span class="l">${LABEL[k]}</span><span class="t"><b style="width:${(counts[k] / max) * 80}%;background:${HUE[k]}"></b><em>${counts[k]}</em></span></button>`).join('');
    el.addEventListener('click', (e) => {
      const b = e.target.closest('.bar'); if (!b) return;
      on = on === b.dataset.i ? null : b.dataset.i;
      el.querySelectorAll('.bar').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.i === on)));
      table();
    });
  }

  let sortK = 4, dir = -1;
  function table() {
    const rows = U.rows.filter((r) => (!on || r[2] === on) && (order === null || String(r[0]) === order)).slice().sort((a, b) => {
      const va = sortK === 0 ? U.orders[a[0]].frame : sortK === 2 ? LABEL[a[2]] : a[sortK];
      const vb = sortK === 0 ? U.orders[b[0]].frame : sortK === 2 ? LABEL[b[2]] : b[sortK];
      return va < vb ? -dir : va > vb ? dir : 0;
    });
    document.getElementById('shown').textContent = rows.length + ' shown';
    document.querySelectorAll('.seg').forEach((s) => s.classList.toggle('dim', !!on && !U.rows.some((r) => String(r[0]) === s.dataset.o && r[2] === on)));
    document.getElementById('rows').innerHTML = rows.map((r) => `<tr><td>${r[1]}</td><td class="f">${U.orders[r[0]].frame}</td><td class="who"><i style="background:${HUE[r[2]]}"></i>${LABEL[r[2]]}</td><td class="k">${r[3]}</td><td class="d">${r[4]}</td><td class="s"><button class="sign" type="button">Sign</button></td></tr>`).join('');
  }
  document.querySelector('thead').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const k = +b.dataset.k; dir = k === sortK ? -dir : (k === 4 ? -1 : 1); sortK = k;
    document.querySelectorAll('th button').forEach((x) => x.removeAttribute('aria-sort'));
    b.setAttribute('aria-sort', dir === 1 ? 'ascending' : 'descending');
    table();
  });

  orders(); bars(); table();
})();
</script>
</body>
</html>
