<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>The Undo List, direction A: the blocks</title>
<meta name="description" content="Mockup: thirteen signatures undo 275 executive actions, drawn as thirteen blocks sized by count and coloured by who feels it.">
<meta property="og:title" content="The Undo List, direction A: the blocks">
<meta property="og:description" content="Mockup: thirteen blocks, one per signing order, 275 squares coloured by who feels it.">
<meta property="og:image" content="https://hoplight.ai/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="apple-mobile-web-app-title" content="Undo blocks">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/manifest.webmanifest">
<!--
  UNDOMOCK1, direction A, the blocks. 2026-11-17. Whit: "the marvel of this is the bundling of EOs,
  the strategic message framing, and the tools encyclopedia of signed things to undo- available in a
  filterable sortable database".
  References (references/REFERENCES.md): Linear, the real thing fills the lower part of the first
  screen under words that fit one breath; Pentagram, the controls rewrite the archive beneath them
  (the issue bars light the field and filter the table, in place).
  Signature element: the treemap, each block's frame name set large inside its own field of squares.
  Proposals: the twelve frame names other than "America isn't a quitter", and the issue hues.
-->
<style>
@font-face { font-family: 'Inter'; src: url('../../fonts/inter-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
:root { --ink: #0F1B2D; --ink2: #3A4A63; --gold: #D4950A; --gold-deep: #996D00; --line: #E3E7EE; --field: #F4F6F9; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: #fff; color: var(--ink); font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums lining-nums; }
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 64px; }
header.site { height: 56px; display: flex; align-items: center; }
.mark { font-size: 15px; font-weight: 600; color: var(--ink); text-decoration: none; }
.hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; padding: 16px 0 24px; }
h1 { font-size: 44px; line-height: 1.1; font-weight: 600; letter-spacing: -0.015em; text-wrap: balance; max-width: 20ch; }
.btn { font: inherit; font-size: 15px; font-weight: 600; border-radius: 8px; padding: 14px 22px; cursor: pointer; white-space: nowrap; }
.btn-primary { background: var(--ink); color: #fff; border: 0; }
.btn-primary:hover { background: var(--gold); color: var(--ink); }
.btn:focus-visible, .tile:focus-visible, .bar:focus-visible, th button:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--gold); }

#map { position: relative; width: 100%; height: 600px; }
.tile { position: absolute; background: var(--field); border-radius: 6px; padding: 12px 12px 10px; overflow: hidden; cursor: pointer; }
.tile h2 { font-size: 22px; line-height: 1.12; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.tile .n { font-size: 13px; color: var(--ink2); margin-top: 2px; }
.tile .sq { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 8px; }
.tile .sq i { display: block; border-radius: 2px; transition: opacity .15s ease-out; }
.tile.small h2 { font-size: 15px; }

.below { padding: 48px 0 0; }
h3 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
#bars { display: grid; grid-template-columns: 1fr 1fr; column-gap: 64px; row-gap: 4px; }
.bar { display: grid; grid-template-columns: 210px 1fr; align-items: center; gap: 12px; background: none; border: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; padding: 4px 0; border-radius: 4px; }
.bar span.l { font-size: 13px; }
.bar span.t { display: flex; align-items: center; gap: 8px; }
.bar span.t b { display: block; height: 14px; border-radius: 2px; }
.bar span.t em { font-style: normal; font-size: 13px; }
.bar[aria-pressed="true"] span.l { font-weight: 600; }

table { width: 100%; border-collapse: collapse; margin-top: 48px; }
th { text-align: left; border-bottom: 2px solid var(--ink); padding: 0; }
th button { font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: none; border: 0; padding: 10px 8px 10px 0; cursor: pointer; }
th button[aria-sort]::after { content: ' \2193'; }
th button[aria-sort="ascending"]::after { content: ' \2191'; }
td { padding: 9px 8px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 15px; }
td.who { white-space: nowrap; }
td.who i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 8px; }
td.d { white-space: nowrap; }
.foot { height: 96px; }

@media (max-width: 760px) {
  .wrap { padding: 0 16px; }
  header.site { height: 48px; }
  .hero { flex-direction: column; align-items: stretch; gap: 16px; padding: 4px 0 16px; }
  h1 { font-size: 30px; }
  .btn-primary { width: 100%; }
  #map { height: 720px; }
  .tile { padding: 8px 8px 6px; }
  .tile h2 { font-size: 15px; }
  .tile h2 .n { font-weight: 400; }
  #bars { grid-template-columns: 1fr; }
  .bar { grid-template-columns: 150px 1fr; }
  table thead { display: none; }
  table, tbody, tr, td { display: block; }
  tr { border-bottom: 1px solid var(--line); padding: 10px 0; }
  td { border: 0; padding: 0; }
  td.k, td.d { display: inline; font-size: 13px; color: var(--ink2); margin-right: 8px; }
  td.f, td.who { font-size: 13px; }
}
</style>
</head>
<body>
<header class="site wrap"><a class="mark" href="/">Hoplight</a></header>
<main class="wrap">
  <section class="hero">
    <h1>Thirteen signatures undo 275 executive actions.</h1>
    <button class="btn btn-primary" type="button">Sign all thirteen</button>
  </section>
  <div id="map" role="list" aria-label="The thirteen signing orders, sized by how many actions each undoes"></div>
  <section class="below">
    <h3>Who feels it</h3>
    <div id="bars"></div>
    <table>
      <thead><tr>
        <th><button type="button" data-k="1">Action</button></th>
        <th><button type="button" data-k="0">Order</button></th>
        <th><button type="button" data-k="2">Who feels it</button></th>
        <th><button type="button" data-k="3">Kind</button></th>
        <th><button type="button" data-k="4" aria-sort="descending">Signed</button></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
  <div class="foot"></div>
</main>
<script src="undo-data.js"></script>
<script>
(function () {
  const U = window.UNDO;
  const HUE = Object.fromEntries(U.issues.map((x) => [x[0], x[2]]));
  const LABEL = Object.fromEntries(U.issues.map((x) => [x[0], x[1]]));
  const ORDER = Object.fromEntries(U.issues.map((x, i) => [x[0], i]));
  const DARK = new Set(['allies', 'air-water', 'immigrants', 'government-works', 'checks-on-power', 'public-safety', 'prices', 'equal-treatment']);
  let on = null;

  // Squarified treemap (Bruls, Huizing, van Wijk 2000).
  function squarify(items, x, y, w, h) {
    const total = items.reduce((s, d) => s + d.v, 0);
    const scale = (w * h) / total;
    const out = [];
    let rest = items.map((d) => ({ ...d, a: d.v * scale }));
    while (rest.length) {
      const side = Math.min(w, h);
      let row = [rest[0]], best = worst(row, side), i = 1;
      while (i < rest.length) {
        const next = row.concat(rest[i]);
        const wv = worst(next, side);
        if (wv > best) break;
        row = next; best = wv; i++;
      }
      const sum = row.reduce((s, d) => s + d.a, 0);
      if (w >= h) {
        const cw = sum / h; let cy = y;
        for (const d of row) { const ch = d.a / cw; out.push({ ...d, x, y: cy, w: cw, h: ch }); cy += ch; }
        x += cw; w -= cw;
      } else {
        const rh = sum / w; let cx = x;
        for (const d of row) { const cw = d.a / rh; out.push({ ...d, x: cx, y, w: cw, h: rh }); cx += cw; }
        y += rh; h -= rh;
      }
      rest = rest.slice(i);
    }
    return out;
    function worst(r, s) {
      const sum = r.reduce((t, d) => t + d.a, 0);
      const max = Math.max(...r.map((d) => d.a)), min = Math.min(...r.map((d) => d.a));
      return Math.max((s * s * max) / (sum * sum), (sum * sum) / (s * s * min));
    }
  }

  // The issue most of a block's actions touch, named on the block so its colour needs no key.
  function top(i) {
    const c = {};
    for (const x of U.rows) if (x[0] === i) c[x[2]] = (c[x[2]] || 0) + 1;
    const k = Object.keys(c).sort((a, b) => c[b] - c[a])[0];
    return /^[A-Z][a-z ]/.test(LABEL[k]) ? LABEL[k].charAt(0).toLowerCase() + LABEL[k].slice(1) : LABEL[k];
  }

  // Lay the blocks out for a given overhead, then find the one square size every block can hold.
  function layout(map, W, H, phone, over) {
    const GAP = 4;
    const items = U.orders.map((o, i) => ({ i, o, v: o.n + over })).sort((a, b) => b.v - a.v);
    const rects = squarify(items, 0, 0, W, H);
    map.innerHTML = '';
    const tiles = rects.map((r) => {
      const t = document.createElement('div');
      t.className = 'tile' + (r.w < 150 ? ' small' : '');
      t.tabIndex = 0; t.setAttribute('role', 'listitem');
      t.title = r.o.title + '. ' + r.o.line;
      Object.assign(t.style, { left: r.x + GAP / 2 + 'px', top: r.y + GAP / 2 + 'px', width: r.w - GAP + 'px', height: r.h - GAP + 'px' });
      t.innerHTML = phone
        ? `<h2>${r.o.frame} <span class="n">${r.o.n}</span></h2><div class="sq"></div>`
        : `<h2>${r.o.frame}</h2><div class="n">${r.o.n} actions, most on ${top(r.i)}</div><div class="sq"></div>`;
      map.appendChild(t);
      return { r, t };
    });
    let s = 40;
    for (const { r, t } of tiles) {
      const pad = phone ? 16 : 24;
      const head = t.querySelector('.sq').offsetTop + 2;
      const aw = r.w - GAP - pad, ah = r.h - GAP - head - (phone ? 6 : 10);
      let k = 40;
      while (k > 2) { const cols = Math.floor((aw + 2) / (k + 2)); const rows = Math.ceil(r.o.n / Math.max(cols, 1)); if (cols > 0 && rows * (k + 2) - 2 <= ah) break; k--; }
      s = Math.min(s, k);
    }
    return { tiles, s };
  }

  function draw() {
    const map = document.getElementById('map');
    const W = map.clientWidth, H = map.clientHeight, phone = W < 600;
    // Try overheads and keep the one that gives the largest common square.
    let best = { s: 0, over: 0 };
    for (let over = 0; over <= 40; over += 2) { const { s } = layout(map, W, H, phone, over); if (s > best.s) best = { s, over }; }
    const { tiles, s } = layout(map, W, H, phone, best.over);
    for (const { r, t } of tiles) {
      const rows = U.rows.filter((x) => x[0] === r.i).sort((a, b) => ORDER[a[2]] - ORDER[b[2]]);
      t.querySelector('.sq').innerHTML = rows.map((x) => `<i data-i="${x[2]}" title="${x[1].replace(/"/g, '&quot;')}" style="width:${s}px;height:${s}px;background:${HUE[x[2]]}"></i>`).join('');
    }
    light();
  }

  function bars() {
    const counts = {};
    for (const r of U.rows) counts[r[2]] = (counts[r[2]] || 0) + 1;
    const max = Math.max(...Object.values(counts));
    const keys = U.issues.map((x) => x[0]).sort((a, b) => counts[b] - counts[a]);
    document.getElementById('bars').innerHTML = keys.map((k) => `<button class="bar" type="button" aria-pressed="false" data-i="${k}"><span class="l">${LABEL[k]}</span><span class="t"><b style="width:${(counts[k] / max) * 100}%;background:${HUE[k]}"></b><em>${counts[k]}</em></span></button>`).join('');
    // Column-major so the biggest issues read down the first column.
    const el = document.getElementById('bars');
    if (innerWidth > 760) { el.style.gridAutoFlow = 'column'; el.style.gridTemplateRows = `repeat(${Math.ceil(keys.length / 2)}, auto)`; }
    el.addEventListener('click', (e) => {
      const b = e.target.closest('.bar'); if (!b) return;
      on = on === b.dataset.i ? null : b.dataset.i;
      el.querySelectorAll('.bar').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.i === on)));
      light(); table();
    });
  }

  function light() {
    document.querySelectorAll('#map i').forEach((i) => { i.style.opacity = !on || i.dataset.i === on ? 1 : 0.18; });
  }

  let sortK = 4, dir = -1;
  function table() {
    const rows = U.rows.filter((r) => !on || r[2] === on).slice().sort((a, b) => {
      const va = sortK === 0 ? U.orders[a[0]].frame : sortK === 2 ? LABEL[a[2]] : a[sortK];
      const vb = sortK === 0 ? U.orders[b[0]].frame : sortK === 2 ? LABEL[b[2]] : b[sortK];
      return va < vb ? -dir : va > vb ? dir : 0;
    });
    document.getElementById('rows').innerHTML = rows.map((r) => `<tr><td>${r[1]}</td><td class="f">${U.orders[r[0]].frame}</td><td class="who"><i style="background:${HUE[r[2]]}"></i>${LABEL[r[2]]}</td><td class="k">${r[3]}</td><td class="d">${r[4]}</td></tr>`).join('');
  }
  document.querySelector('thead').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const k = +b.dataset.k; dir = k === sortK ? -dir : (k === 4 ? -1 : 1); sortK = k;
    document.querySelectorAll('th button').forEach((x) => x.removeAttribute('aria-sort'));
    b.setAttribute('aria-sort', dir === 1 ? 'ascending' : 'descending');
    table();
  });

  bars(); draw(); table();
  let t; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(draw, 100); });
})();
</script>
</body>
</html>
