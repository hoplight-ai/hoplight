<!--
  CARDMARK1, 2026-11-07. Whit: "each one feels like a muddled brand. I feel like we need some sort of
  consistent marker of it being a hot light product or report, but each one needs to look like its own
  specific brand." Five marking systems, each on the same three cards.

  Where each tool's look comes from (read from the live pages on 2026-11-07, never invented):
  - Gut Check, gut-check-hoplight.vercel.app/play: white ground, navy #0F1B2D, Inter 600 headline at
    -0.02em, the statement card (18px radius, hairline inset shadow), outlined navy pill buttons
    "Agree" and "Fight it", gold #D4950A progress bar on an #EEF1F5 track, muted text #4E5A6B.
  - Revenge or Justice, hoplight.ai/revenge-or-justice: white ground, Albert Sans 600 title at -0.02em,
    navy "Revenge or", "Justice" in #996D00, the bars picture (revenge #9C3327, justice #0F1B2D),
    muted text #575752.
  - DNC autopsy, taken apart, hoplight.ai/portfolio/dnc-autopsy-taken-apart.html: white ground, ink
    #1A1A1A, system sans 700 title, numbers in red #C0392B at weight 800 ("480+", "pages total"), the
    pull-quote block with a red left rule on a 6% red tint, muted text #575752.
  Hoplight marker: the seed (src/lib/brand/seed.ts), the word in Albert Sans 600 as the site's lockup
  draws it (src/lib/brand/marks.ts), navy #0F1B2D, gold #D4950A, seed gold #E8A820.
-->

:root { --ink: #0F1B2D; --gold: #D4950A; --gold-deep: #996D00; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #FFFFFF; color: var(--ink); }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.45; }
.page { max-width: 1400px; margin: 0 auto; padding: 32px 16px 96px; }
h1 { font-size: clamp(26px, 1.4rem + 1.2vw, 34px); font-weight: 600; letter-spacing: -0.01em; line-height: 1.15; margin: 0 0 8px; text-wrap: balance; }
.lede { margin: 0 0 8px; font-size: 17px; }
section { margin-top: 72px; }
h2 { font-size: 22px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 b { display: inline-block; min-width: 1.4em; color: var(--gold-deep); font-weight: 700; }
.what { margin: 0 0 20px; font-size: 16px; max-width: 62ch; }
.full { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
.small-label { margin: 28px 0 10px; font-size: 14px; font-weight: 500; }
.small { display: flex; flex-wrap: wrap; gap: 16px; }
.small .shot { width: 300px; flex: none; }

/* A card is drawn at 1200 by 630 and scaled to its box. */
.card { position: relative; width: 100%; aspect-ratio: 1200 / 630; overflow: hidden; border-radius: 12px; box-shadow: 0 0 0 1px rgba(15, 27, 45, 0.16); background: #FFFFFF; }
.c { position: absolute; left: 0; top: 0; width: 1200px; height: 630px; transform-origin: 0 0; overflow: hidden; background: #FFFFFF; }
.art { position: absolute; left: 0; top: 0; width: 1200px; height: 630px; transform-origin: 0 0; display: flex; align-items: center; justify-content: space-between; padding: 0 72px; }

/* The phone's own caption under a link preview (system C only). */
.cap { background: #E9E9EB; border-radius: 0 0 12px 12px; padding: 8px 12px 10px; margin-top: -12px; padding-top: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
.cap .t { font-size: 15px; font-weight: 600; line-height: 1.25; color: #000000; }
.cap .d { font-size: 13px; color: #6B6B70; }

/* ---------- The three tools, each in its own look ---------- */
/* Gut Check */
.gut .name { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 140px; line-height: 0.98; letter-spacing: -0.02em; color: #0F1B2D; }
.gut .bar { width: 300px; height: 16px; border-radius: 8px; background: #EEF1F5; margin-top: 40px; overflow: hidden; }
.gut .bar i { display: block; width: 36%; height: 100%; background: #D4950A; }
.gut .play { width: 560px; display: flex; flex-direction: column; align-items: flex-start; }
.gut .q { width: 470px; padding: 40px 44px; border-radius: 36px; background: #FFFFFF; transform: rotate(3deg); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 56px; line-height: 1.08; letter-spacing: -0.02em; color: #0F1B2D;
  box-shadow: inset 0 0 0 3px rgba(15, 27, 45, 0.14), 0 2px 4px rgba(15, 27, 45, 0.06), 0 20px 56px rgba(15, 27, 45, 0.10); }
.gut .pills { display: flex; gap: 16px; margin-top: 40px; }
.gut .pills span { white-space: nowrap; border: 4px solid #0F1B2D; border-radius: 999px; padding: 8px 26px 12px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 56px; line-height: 1.1; color: #0F1B2D; }

/* Revenge or Justice */
.roj .name { font-family: 'Albert Sans', sans-serif; font-weight: 600; font-size: 128px; line-height: 1.0; letter-spacing: -0.02em; color: #0F1B2D; }
.roj .name .j { color: #996D00; }
.roj svg.bars { width: 320px; height: 320px; flex: none; }

/* DNC autopsy, taken apart */
.dnc .name { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 86px; line-height: 1.04; letter-spacing: -0.01em; color: #1A1A1A; }
.dnc .pull { background: rgba(192, 57, 43, 0.06); border-left: 14px solid #C0392B; padding: 40px 52px 44px 44px; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
.dnc .num { font-weight: 800; font-size: 150px; line-height: 1; color: #C0392B; font-variant-numeric: tabular-nums lining-nums; letter-spacing: -0.01em; }
.dnc .lab { font-weight: 400; font-size: 56px; line-height: 1.1; color: #575752; margin-top: 12px; }

/* ---------- The five Hoplight markers ---------- */
.hw { font-family: 'Albert Sans', sans-serif; font-weight: 600; letter-spacing: -0.02em; }
.kw { font-family: 'Albert Sans', sans-serif; font-weight: 600; letter-spacing: -0.01em; }

/* A, corner seal: the app-icon tile pinned to the top-left corner, the kind beside it. */
.sealA { position: absolute; left: 40px; top: 36px; display: flex; align-items: center; gap: 22px; }
.sealA .tile { width: 112px; height: 112px; border-radius: 26px; background: #0F1B2D; display: flex; align-items: center; justify-content: center; }
.sealA .words { font-size: 48px; line-height: 1.02; color: #0F1B2D; }
.sealA .words .kw { color: #0F1B2D; }

/* B, spine: a navy strip down the left edge. */
.spineB { position: absolute; left: 0; top: 0; bottom: 0; width: 108px; background: #0F1B2D; display: flex; flex-direction: column; align-items: center; padding-top: 40px; }
.spineB .v { writing-mode: vertical-rl; margin-top: 30px; font-size: 48px; line-height: 1; color: #FFFFFF; white-space: nowrap; }
.spineB .v .kw { color: #D4950A; }

/* D, frame: one gold frame inset on every card, the kind set into its bottom line. */
.frameD { position: absolute; inset: 30px; border: 10px solid #D4950A; border-radius: 6px; pointer-events: none; }
.legendD { position: absolute; left: 76px; bottom: 6px; background: #FFFFFF; padding: 0 22px; display: flex; align-items: center; gap: 16px; font-size: 48px; line-height: 1; color: #0F1B2D; }
.legendD .kw { color: #996D00; }

/* E, maker's mark: under the name, in the tool's own type and its own quiet colour. */
.markE { display: flex; align-items: center; gap: 16px; margin-top: 34px; font-size: 48px; line-height: 1; letter-spacing: 0; }
.gut .markE { font-family: 'Inter', sans-serif; font-weight: 500; color: #4E5A6B; }
.roj .markE { font-family: 'Albert Sans', sans-serif; font-weight: 600; color: #575752; }
.dnc .markE { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; color: #575752; }
.markE b { font-weight: inherit; }
.gut .markE + .bar { display: none; }
</style>
</head>
<body>
<main class="page">
  <h1>Five ways to mark a Hoplight card</h1>
  <p class="lede">Same three cards in each: two products and one report.</p>
  <div id="systems"></div>
</main>

<script>
(function () {
  // The seed of life, as src/lib/brand/seed.ts draws it: seven circles of radius 17 in a 100 box,
  // the gold dot at the centre always gold.
  var SEED_GOLD = '#E8A820';
  function seed(px, line) {
    var pts = [[50, 50], [50, 33], [64.7, 41.5], [64.7, 58.5], [50, 67], [35.3, 58.5], [35.3, 41.5]];
    var c = pts.map(function (p) { return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="17"/>'; }).join('');
    return '<svg width="' + px + '" height="' + px + '" viewBox="0 0 100 100" aria-hidden="true">'
      + '<g fill="none" stroke="' + line + '" stroke-width="4.6" stroke-opacity="0.95">' + c + '</g>'
      + '<circle cx="50" cy="50" r="7" fill="' + SEED_GOLD + '"/></svg>';
  }

  // Revenge or Justice: the bars picture exactly as the live page draws it (rows -0.62, 0.86, 0.4, -0.28).
  function bars() {
    var rows = [-0.62, 0.86, 0.4, -0.28], mid = 140, rowH = 52, top = (280 - rows.length * rowH) / 2, s = '';
    rows.forEach(function (v, i) {
      var y = top + i * rowH + rowH / 2, w = Math.abs(v) * (mid - 8), x = v < 0 ? mid - w : mid;
      s += '<line x1="8" y1="' + y + '" x2="272" y2="' + y + '" stroke="#0F1B2D" stroke-opacity="0.16" stroke-width="2"/>'
        + '<rect x="' + x.toFixed(1) + '" y="' + (y - 13) + '" width="' + w.toFixed(1) + '" height="26" rx="5" fill="' + (v < 0 ? '#9C3327' : '#0F1B2D') + '"/>';
    });
    s += '<line x1="' + mid + '" y1="' + (top - 10) + '" x2="' + mid + '" y2="' + (top + rows.length * rowH + 10) + '" stroke="#0F1B2D" stroke-width="3"/>';
    return '<svg class="bars" viewBox="0 0 280 280" aria-hidden="true">' + s + '</svg>';
  }

  var TOOLS = [
    { id: 'gut', title: 'Gut Check', kind: 'product', domain: 'gut-check-hoplight.vercel.app', line: '#4E5A6B' },
    { id: 'roj', title: 'Revenge or Justice', kind: 'product', domain: 'hoplight.ai', line: '#575752' },
    { id: 'dnc', title: 'DNC autopsy, taken apart', kind: 'report', domain: 'hoplight.ai', line: '#575752' }
  ];

  // The maker's mark (system E): the seed in the tool's own quiet colour, then the words.
  function markE(t) {
    return '<div class="markE">' + seed(60, t.line) + '<span><b>Hoplight</b> ' + t.kind + '</span></div>';
  }

  function body(t, withMark) {
    var m = withMark ? markE(t) : '';
    if (t.id === 'gut') {
      return '<div class="art gut"><div><div class="name">Gut<br>Check</div>' + m + '<div class="bar"><i></i></div></div>'
        + '<div class="play"><div class="q">Hidden persuasion is manipulation</div>'
        + '<div class="pills"><span>Agree</span><span>Fight it</span></div></div></div>';
    }
    if (t.id === 'roj') {
      return '<div class="art roj"><div><div class="name">Revenge or<br><span class="j">Justice</span></div>' + m + '</div>' + bars() + '</div>';
    }
    return '<div class="art dnc"><div><div class="name">DNC<br>autopsy,<br>taken apart</div>' + m + '</div>'
      + '<div class="pull"><div class="num">480+</div><div class="lab">pages total</div></div></div>';
  }

  // Fit the 1200 by 630 tool body into the box a system leaves it.
  function fit(t, box, withMark) {
    var k = Math.min(box.w / 1200, box.h / 630);
    var x = box.x + (box.w - 1200 * k) / 2, y = box.y + (box.h - 630 * k) / 2;
    return body(t, withMark).replace('class="art ', 'style="transform: translate(' + x + 'px,' + y + 'px) scale(' + k + ')" class="art ');
  }

  var SYSTEMS = [
    { l: 'A', n: 'Corner seal', what: 'The Hoplight tile, the same as the app icon, pinned in the top-left corner with the kind beside it.',
      draw: function (t) {
        return fit(t, { x: 0, y: 0, w: 1200, h: 630 })
          + '<div class="sealA"><div class="tile">' + seed(84, SEED_GOLD) + '</div>'
          + '<div class="words"><div class="hw">Hoplight</div><div class="kw">' + t.kind + '</div></div></div>';
      } },
    { l: 'B', n: 'Spine', what: 'A navy strip down the left edge, like a book on a shelf. Everything right of it is the tool.',
      draw: function (t) {
        return fit(t, { x: 108, y: 0, w: 1092, h: 630 })
          + '<div class="spineB">' + seed(64, SEED_GOLD) + '<div class="v"><span class="hw">Hoplight</span> <span class="kw">' + t.kind + '</span></div></div>';
      } },
    { l: 'C', n: 'Caption line', what: 'The picture is all tool. Hoplight and the kind ride in the title the phone prints under it.', caption: true,
      draw: function (t) { return fit(t, { x: 0, y: 0, w: 1200, h: 630 }); } },
    { l: 'D', n: 'Gold frame', what: 'One gold frame on every card, the kind set into its bottom line.',
      draw: function (t) {
        return fit(t, { x: 40, y: 44, w: 1120, h: 542 })
          + '<div class="frameD"></div><div class="legendD"><span><span class="hw">Hoplight</span> <span class="kw">' + t.kind + '</span></span></div>';
      } },
    { l: 'E', n: "Maker's mark", what: 'Nothing laid over the art. The seed and the kind sit under the name, in the tool’s own type.',
      draw: function (t) { return fit(t, { x: 0, y: 0, w: 1200, h: 630 }, true); } }
  ];

  function shot(s, t, small) {
    var label = t.title + ', a Hoplight ' + t.kind;
    var h = '<div class="shot"><div class="card" role="img" aria-label="' + label + ', system ' + s.l + '"><div class="c">' + s.draw(t) + '</div></div>';
    if (s.caption && small) h += '<div class="cap"><div class="t">' + t.title + ', a Hoplight ' + t.kind + '</div><div class="d">' + t.domain + '</div></div>';
    return h + '</div>';
  }

  var out = '';
  SYSTEMS.forEach(function (s) {
    var full = TOOLS.map(function (t) { return shot(s, t, false); }).join('');
    var small = TOOLS.map(function (t) { return shot(s, t, true); }).join('');
    out += '<section id="' + s.l.toLowerCase() + '"><h2><b>' + s.l + '</b>' + s.n + '</h2><p class="what">' + s.what + '</p>'
      + '<div class="full">' + full + '</div>'
      + '<p class="small-label">At text-message size</p><div class="small">' + small + '</div></section>';
  });
  document.getElementById('systems').innerHTML = out;

  function scaleAll() {
    document.querySelectorAll('.card').forEach(function (card) {
      card.firstChild.style.transform = 'scale(' + (card.clientWidth / 1200) + ')';
    });
  }
  scaleAll();
  new ResizeObserver(scaleAll).observe(document.body);
})();
</script>
</body>
</html>
