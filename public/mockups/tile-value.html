<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>What each tool does, before the tap</title>
<meta name="description" content="Five portfolio tiles drawn five ways: today's tile, the promise, the proof, the first move, and the proof plus the promise.">
<meta property="og:title" content="What each tool does, before the tap">
<meta property="og:description" content="Five portfolio tiles drawn five ways, to pick how a tile says what its tool does.">
<meta property="og:image" content="https://hoplight.ai/og.png">

<!--
  TILEVALUE1, 2026-11-07. Whit: "wonder cards is a yes but i'm realizing the user can't tell what each of
  these does just by looking. the unique value add needs to be clear before they will click. how could we
  do that artfully clearly and tastefully".

  The job: a stranger sees, before tapping, what each tool does for them. Five tools (Revenge or Justice,
  The Undo List, Letters, Which AI should I use?, Wonder Cards), five rows: today's live tile and four
  treatments, each changing one thing. Columns line up, so one tool stacks down the page and a row reads
  as a whole portfolio.

  References borrowed (design/references/REFERENCES.md):
  - Pentagram: the work is the content and each item gets one short line, so a tile is a picture and one
    sentence, and the promise row is that sentence alone.
  - Stripe, and the set's shared pattern "something on the page is real and current": a real screen
    instead of decoration, so the proof row's pictures are crops of each tool's own output.
  Signature element: the proof crops. Everything else on the page is the live portfolio's own quiet
  chrome (white tiles on the navy gallery field, 14px grey line, gold-deep link).

  Token plan: #FFFFFF page; #0F1B2D navy, the ink and the gallery field as live; #555550 the tile line
  as live; #996D00 the link as live; white at 0.78 for the row notes on navy. Type: Inter for the page
  and every tile body, as live; inside a tile, each tool's own display face (Albert Sans 600 for the
  three Hoplight-hosted tools, Inter 700 for Letters, Playfair Display 700 for Wonder Cards).
  Layout: a short white header, then one navy field holding five named rows of the same five tiles. At
  390 the field swipes sideways as one piece with the row names pinned, so a swipe moves every row.

  Wireframe, 1440:
    What each tool does, before the tap
    The same five tools, drawn five ways ...
    [navy field                                                          ]
    [ Today  The live tile ...                                           ]
    [ [RoJ ] [Undo] [Letters] [Which AI] [Wonder]                        ]
    [ The promise  Leads with what you get ...                           ]
    [ ...                                                                ]

  Critique against the generic look, and what changed: round one numbered the rows 1 to 4 in big type
  like the card-frames mockup; that is numbering on things that are not a sequence, so the rows carry
  their plain names. The question row (the brief's third proposal) was drafted and dropped: two of the
  five names are already questions (Revenge or Justice, Which AI should I use?) and Wonder Cards' whole
  product is questions, so the row repeated the names. It is replaced by the first move (the link says
  what you do first), a mechanism the drafting turned up.

  Review by hand, 2026-11-07 (the visual-sociologist agent cannot be started from inside a lane): the
  provenance note under the lede went (machinery on a reading page; it lives in the lane report), every
  row note was cut to one short sentence so none wraps past two lines at 390, and The Undo List's crop
  was tightened to its headline and first row of blocks so the headline reads on a phone.
  Wonder Cards is not on the tool list, so its first tile is drawn the way the card route draws a tile
  (docs/renders/tilevalue1-2026-11-07/today-wonder-cards.html).

  Where every new line comes from is written beside it in TOOLS below. Pictures: public/mockups/tile-value/,
  cut by docs/renders/tilevalue1-2026-11-07/crops.py from screens capture.mjs took on 2026-11-07.
-->
<style>
@font-face { font-family: 'Inter'; src: url('/fonts/inter-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
@font-face { font-family: 'Albert Sans'; src: url('/fonts/albert-sans-latin-600-normal.woff2') format('woff2'); font-weight: 600; font-display: swap; }
@font-face { font-family: 'Playfair Display'; src: url('/fonts/playfair-display-latin-700-normal.woff2') format('woff2'); font-weight: 700; font-display: swap; }

* { box-sizing: border-box; }
html, body { margin: 0; background: #FFFFFF; color: #0F1B2D; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.top { max-width: 1440px; margin: 0 auto; padding: 32px 24px 28px; }
h1 { font-size: clamp(28px, 1.2rem + 1.6vw, 42px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; margin: 0 0 10px; text-wrap: balance; }
.lede { margin: 0; font-size: 17px; max-width: 62ch; color: #2A3F5F; }

.field { background: #0F1B2D; color: #FFFFFF; padding: 8px 0 48px; }
.grid { max-width: 1440px; margin: 0 auto; padding: 0 24px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); column-gap: 16px; }
.rowhead { grid-column: 1 / -1; padding: 36px 0 14px; }
.rowhead h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
.rowhead p { margin: 4px 0 0; font-size: 15px; color: rgba(255, 255, 255, 0.78); max-width: 72ch; }
.swipe { display: none; }

/* A tile, as the live portfolio draws it (globals.css .wcard), then changed one way per row. */
.tile { position: relative; display: flex; flex-direction: column; min-width: 0; background: #FFFFFF; color: #0F1B2D; border: 1px solid rgba(15, 27, 45, 0.18); border-radius: 8px; overflow: hidden; text-decoration: none; }
.tile:focus-visible { outline: 3px solid #E8A820; outline-offset: 3px; }
.pic { aspect-ratio: 1200 / 630; background: #0F1B2D; overflow: hidden; }
.pic img { width: 100%; height: 100%; display: block; object-fit: cover; }
.body { padding: 20px; flex: 1; display: flex; flex-direction: column; }
.line { margin: 0; font-size: 14px; line-height: 1.5; color: #555550; flex: 1; }
.go { margin-top: 12px; font-size: 12.5px; font-weight: 600; color: #996D00; }
.tile:hover .go { text-decoration: underline; text-underline-offset: 3px; }

/* The tool's name in its own face and colours, small, above a promise or a line. */
.nm { font-family: var(--face); font-weight: var(--w); font-size: 15px; line-height: 1.15; letter-spacing: -0.01em; color: var(--ink); margin: 0 0 6px; }
.nm b { font-weight: inherit; color: var(--accent); }
.pr { font-family: var(--face); font-weight: var(--w); font-size: 20px; line-height: 1.22; letter-spacing: -0.015em; color: var(--ink); margin: 0; flex: 1; text-wrap: pretty; }

/* The promise row: no picture; the tile's top is the tool's ground with the promise on it. */
.say { background: var(--ground); padding: 20px; flex: 1; display: flex; flex-direction: column; min-height: 168px; }
.say .nm { color: var(--onground); }
.say .nm b { color: var(--onaccent); }
.say .pr { color: var(--onground); font-size: 22px; }
.foot { padding: 12px 20px 14px; }
.foot .go { margin-top: 0; }

/* The proof plus the promise: the name small, the promise under it, the line gone. */
.both .pr { font-size: 19px; }

@media (max-width: 1099px) {
  /* Phone and tablet: the field swipes sideways as one piece, so every row moves together and one
     tool stays stacked down the page. The row names stay pinned to the left edge while it moves. */
  .field { overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-left: 16px; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
  .grid { --tw: min(334px, calc(100vw - 56px)); grid-template-columns: repeat(5, var(--tw)); column-gap: 12px; padding: 0 16px; width: max-content; max-width: none; }
  .rowhead { padding: 28px 0 10px; }
  .rowhead > div { position: sticky; left: 16px; width: calc(100vw - 32px); }
  .rowhead h2 { font-size: 19px; }
  .tile { scroll-snap-align: start; }
  .swipe { display: block; margin: 0; padding: 20px 0 0; font-size: 14px; color: rgba(255, 255, 255, 0.78); }
  .top { padding: 24px 16px 22px; }
  .lede { font-size: 16px; }
}
@media (max-width: 640px) {
  /* As live at this width: the card face is cropped to its middle band and the text sits tighter. */
  .card .pic { aspect-ratio: 1200 / 330; }
  .body { padding: 12px 16px 14px; }
  .go { margin-top: 6px; }
  .say { padding: 16px; min-height: 0; }
  .foot { padding: 10px 16px 12px; }
}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>What each tool does, before the tap</h1>
    <p class="lede">The same five tools, drawn five ways. The first row is the portfolio tile as it is today; each row under it changes one thing.</p>
  </div>
  <section class="field" aria-label="Five ways to draw a tile">
    <div class="grid" id="grid"></div>
  </section>
</main>

<script>
(function () {
  var NAVY = '#0F1B2D', WHITE = '#FFFFFF', GOLD_DEEP = '#996D00';
  var ALBERT = "'Albert Sans', 'Inter', sans-serif", INTER = "'Inter', sans-serif", PLAYFAIR = "'Playfair Display', Georgia, serif";

  // The five tools. name, href, line and look come from src/data/tools.ts as of 2026-11-07, except Wonder
  // Cards, which is not in it: its look and words are read from wonder-cards.vercel.app that day.
  // promise and move are the new lines this mockup proposes; each names its source beside it.
  var TOOLS = [
    { slug: 'revenge-or-justice', name: 'Revenge or <b>Justice</b>', plain: 'Revenge or Justice', href: '/revenge-or-justice',
      face: ALBERT, w: 600, ink: NAVY, accent: GOLD_DEEP, ground: WHITE, onground: NAVY, onaccent: GOLD_DEEP,
      line: 'Paste a statement or a link. It says whether the words sound like revenge or justice, and how to say it so it lands.',
      // From its tools.ts line ("It says whether the words sound like revenge or justice") and the brief's own example.
      promise: 'Find out if a statement sounds like revenge or justice.',
      // Its page's first instruction: "Paste a statement or a link."
      move: 'Paste a statement',
      proofAlt: 'A real reading from Revenge or Justice: five bars running left from the centre line toward Revenge.' },
    { slug: 'undo', name: 'The Undo List', plain: 'The Undo List', href: '/undo',
      face: ALBERT, w: 600, ink: NAVY, accent: NAVY, ground: WHITE, onground: NAVY, onaccent: NAVY,
      line: 'Everything the second Trump administration did, sorted by what it takes to undo it in 2029.',
      // From its tools.ts line ("sorted by what it takes to undo it in 2029") and its headline ("Thirteen signatures undo 275 things").
      promise: 'See what the next president can undo, and what each one takes.',
      // Its first screen's one button: "Sign the first order".
      move: 'Sign the first order',
      proofAlt: 'The Undo List: the headline Thirteen signatures undo 275 things, over a field of squares, the first block gold.' },
    { slug: 'letters', name: 'Letters', plain: 'Letters', href: 'https://letters-ten-eta.vercel.app', ext: true,
      face: INTER, w: 700, ink: '#3A3226', accent: '#B4541A', ground: '#E9F0F3', onground: '#3A3226', onaccent: '#B4541A',
      line: 'A letter-formation app for a four-year-old: where each stroke starts, which way it goes, and in what order. Then paper.',
      // From its tools.ts line ("for a four-year-old: where each stroke starts, which way it goes").
      promise: 'Teach a four-year-old where each stroke starts and which way it goes.',
      // Its first screen's button is "Start"; what follows is tracing (tools.ts: "letter-formation").
      move: 'Start tracing',
      proofAlt: 'Letters: a T with its first stroke traced and the second stroke numbered 2 with an arrow.' },
    { slug: 'which-ai-should-i-use', name: 'Which AI should I use?', plain: 'Which AI should I use?', href: '/tools/which-ai',
      face: ALBERT, w: 600, ink: NAVY, accent: NAVY, ground: WHITE, onground: NAVY, onaccent: NAVY,
      line: 'Answer a few questions, get told which model fits the job.',
      // From its tools.ts line ("get told which model fits the job") and its page ("is your data safe with this platform at this pricing tier?").
      promise: 'Get told which AI fits the job, and whether your data is safe on it.',
      // Its tools.ts line: "Answer a few questions".
      move: 'Answer a few questions',
      proofAlt: 'Which AI should I use?: a recommendation card naming Claude as best for nuanced, high-quality writing.' },
    { slug: 'wonder-cards', name: 'Wonder Cards', plain: 'Wonder Cards', href: 'https://wonder-cards.vercel.app', ext: true,
      face: PLAYFAIR, w: 700, ink: '#005A63', accent: '#005A63', ground: '#005A63', onground: WHITE, onaccent: WHITE,
      // Not on the tool list; written for this mockup from its page's description ("248 questions worth
      // talking about, one at a time, on sunlit poolside photographs, a Capri lemon grove").
      line: 'Questions worth talking about, one card at a time, on photographs of Capri and Palm Beach.',
      // Its page's description: "248 questions worth talking about, one at a time".
      promise: '248 questions worth talking about, one card at a time.',
      // Its card's main button: "Draw another card".
      move: 'Draw a card',
      proofAlt: 'Wonder Cards: a card from the Screen topic asking What do you watch now that would have shocked you at twenty?' },
  ];

  var ROWS = [
    { key: 'today', title: 'Today',
      note: 'The tile as it is live.' },
    { key: 'promise', title: 'The promise',
      note: 'What you get, in words. No picture.' },
    { key: 'proof', title: 'The proof',
      note: 'A real screen from the tool replaces the drawn mark.' },
    { key: 'move', title: 'The first move',
      note: 'The link names your first step.' },
    { key: 'both', title: 'The proof plus the promise',
      note: 'The real screen and the promise. The line goes.' },
  ];

  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function vars(t) {
    return '--face:' + t.face + ';--w:' + t.w + ';--ink:' + t.ink + ';--accent:' + t.accent
      + ';--ground:' + t.ground + ';--onground:' + t.onground + ';--onaccent:' + t.onaccent;
  }
  function go(t, label) {
    return '<span class="go">' + esc(label) + ' ' + (t.ext ? '<span aria-hidden="true">↗</span><span class="sr"> (opens in a new tab)</span>' : '<span aria-hidden="true">→</span>') + '</span>';
  }
  function open(t, cls) {
    return '<a class="tile ' + cls + '" style="' + esc(vars(t)) + '" href="' + esc(t.href) + '"'
      + (t.ext ? ' target="_blank" rel="noopener noreferrer"' : '') + '>';
  }
  function today(t) { return '<div class="pic"><img src="/mockups/tile-value/today-' + t.slug + '.png" alt="" width="1200" height="630" decoding="async"></div>'; }
  function proof(t) {
    var ext = t.slug === 'wonder-cards' ? 'jpg' : 'png';
    return '<div class="pic"><img src="/mockups/tile-value/proof-' + t.slug + '.' + ext + '" alt="' + esc(t.proofAlt) + '" width="1200" height="630" loading="lazy" decoding="async"></div>';
  }

  function tile(row, t) {
    if (row === 'today') {
      return open(t, 'card') + today(t) + '<div class="body"><h3 class="sr">' + esc(t.plain) + '</h3><p class="line">' + esc(t.line) + '</p>' + go(t, 'Open it') + '</div></a>';
    }
    if (row === 'promise') {
      return open(t, 'promise') + '<div class="say"><h3 class="nm">' + t.name + '</h3><p class="pr">' + esc(t.promise) + '</p></div><div class="foot">' + go(t, 'Open it') + '</div></a>';
    }
    if (row === 'proof') {
      return open(t, 'proof') + proof(t) + '<div class="body"><h3 class="nm">' + t.name + '</h3><p class="line">' + esc(t.line) + '</p>' + go(t, 'Open it') + '</div></a>';
    }
    if (row === 'move') {
      return open(t, 'card') + today(t) + '<div class="body"><h3 class="sr">' + esc(t.plain) + '</h3><p class="line">' + esc(t.line) + '</p>' + go(t, t.move) + '</div></a>';
    }
    return open(t, 'both') + proof(t) + '<div class="body"><h3 class="nm">' + t.name + '</h3><p class="pr">' + esc(t.promise) + '</p>' + go(t, 'Open it') + '</div></a>';
  }

  var html = '';
  ROWS.forEach(function (r, i) {
    html += '<div class="rowhead"><div><h2>' + esc(r.title) + '</h2><p>' + esc(r.note) + '</p>'
      + (i === 0 ? '<p class="swipe">Swipe sideways: every row moves together.</p>' : '') + '</div></div>';
    TOOLS.forEach(function (t) { html += tile(r.key, t); });
  });
  document.getElementById('grid').innerHTML = html;
})();
</script>
</body>
</html>
