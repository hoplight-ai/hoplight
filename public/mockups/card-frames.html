<!--
  CARDMARK2, 2026-11-07. Whit, on round one: "The frame is strongest, but we don't need to say product
  every time ... maybe for now we do hop like we need to build a brand recognition. iterate further on
  the concept of just using the bloom or using only hoplite and doing the frame option".

  The frame: round one's system D, one frame on every card, kept; the kind word ("product", "report")
  dropped. The frame is one navy mat on every card, weighted at the foot like a picture mat, and the
  mark sits in that foot. Why a mat and not round one's line: three of the five products (Gut Check,
  Revenge or Justice, The Undo List) are already navy type on white, so a navy line read as one more
  of their own rules. A filled navy edge is drawn by none of the five, so it reads as the frame on all
  of them, and no product is recoloured to make room for it.

  References borrowed (references/REFERENCES.md): It's Nice That, a neutral constant around a banner
  that brings its own colour, so the frame never changes and each product carries all of its own
  colour inside it; Pentagram, the work is the content and each item gets one line, so each
  treatment is five cards and one line. Signature element: the foot of the mat, where the mark lives.

  Where each product's look comes from (read from the live pages on 2026-11-07 with computed styles):
  - Rumi Español, rumi-rouge.vercel.app: the splash, a 160deg gradient #7B3FE4 to #E0409A, the title
    "Rumi Español" in the system sans at 900, white, "Tap to wake up Rumi" at 800, and the Rumi cat,
    its own SVG symbol (#rumiCat) copied here path for path.
  - Roam, roam-two-delta.vercel.app: the address shows the sign-in screen in the Spain trip's skin (a
    trencadis mosaic band). Its core look is used instead, the one Roam's own preview card draws
    (app/opengraph-image.tsx in the roam repo): "Roam" in Fraunces 200 in ink #2C2823, a jade #35836F
    bar, and the line "SIGN IN TO SEE THE ITINERARY", here in Roam's IBM Plex Mono at its login
    tracking (0.2em) in its ink-faint #6F665B. Two changes, both forced: Roam's sand ground is a cream
    the site's no-cream rule refuses under public/, so the card ground is white; and Fraunces is not
    self-hosted anywhere in the workspace, so the word "Roam" is a capture of the live login's own
    wordmark (Fraunces 200 at its 72px optical size), as a transparent picture.
  - Gut Check, gut-check-hoplight.vercel.app/play: white, navy ink #0F1B2D, Inter 600, the statement
    card (white, 18px corners), the two outlined pills "Agree" and "Fight it", body grey #4E5A6B.
  - Revenge or Justice, hoplight.ai/revenge-or-justice: white, Albert Sans 600, "Revenge or" in navy
    and "Justice" in text gold #996D00 (4.62:1 on white), revenge red #9C3327, fill gold #D4950A.
  - The Undo List, hoplight.ai/undo: white, Inter 800 navy, the JetBrains Mono 500 caps label in text
    gold #996D00, and the signature field: navy-outlined squares, gold #D4950A when signed.
  The bloom: the seed of life as src/lib/brand/seed.ts draws it, seven circles of radius 17 in a 100
  box, in the seed gold #E8A820, on navy. Drawn heavier than the site's 1.6% line, because a preview
  card is seen at about a quarter of its size and a hairline vanishes there.
-->
<style>
@font-face { font-family: 'Inter'; src: url('/fonts/inter-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
@font-face { font-family: 'Albert Sans'; src: url('/fonts/albert-sans-latin-600-normal.woff2') format('woff2'); font-weight: 600; font-display: block; }
@font-face { font-family: 'JetBrains Mono'; src: url('/fonts/jetbrains-mono-latin-wght-normal.woff2') format('woff2'); font-weight: 100 800; font-display: block; }
@font-face { font-family: 'IBM Plex Mono'; src: url('/fonts/ibm-plex-mono-latin-400-normal.ttf') format('truetype'); font-weight: 400; font-display: block; }

* { box-sizing: border-box; }
html, body { margin: 0; background: #FFFFFF; color: #0F1B2D; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.4; }
.page { max-width: 1400px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: clamp(24px, 1.2rem + 1.2vw, 34px); font-weight: 600; letter-spacing: -0.01em; line-height: 1.15; margin: 0 0 6px; text-wrap: balance; }
.lede { margin: 0; font-size: 16px; max-width: 64ch; }
section { margin-top: 56px; }
.head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 16px; }
.num { font-size: 64px; font-weight: 600; line-height: 0.9; letter-spacing: -0.03em; }
h2 { font-size: 20px; font-weight: 500; margin: 0; letter-spacing: -0.01em; }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 24px; }
/* Every card carries its treatment number beside it, so a card met mid-scroll says where it belongs. */
.shot { display: grid; grid-template-columns: 22px minmax(0, 1fr); column-gap: 4px; align-items: start; }
.ltr { font-size: 14px; font-weight: 700; line-height: 1; padding-top: 4px; }

@media (max-width: 760px) {
  section { margin-top: 32px; }
  .head { margin-bottom: 10px; }
  .num { font-size: 52px; }
  h2 { font-size: 17px; }
  .cards { grid-template-columns: minmax(0, 320px); gap: 10px; }
  .page { padding-bottom: 32px; }
}

/* A card is drawn at 1200 by 630 and scaled to its box. */
.card { position: relative; width: 100%; aspect-ratio: 1200 / 630; overflow: hidden; border-radius: 10px; }
.c { position: absolute; left: 0; top: 0; width: 1200px; height: 630px; transform-origin: 0 0; overflow: hidden; background: #0F1B2D; }

/* The frame: a navy mat, 28 at the top and sides, 108 at the foot, where the mark sits. */
.win { position: absolute; left: 28px; top: 28px; width: 1144px; height: 494px; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: space-between; padding: 0 68px; }
.foot { position: absolute; left: 96px; top: 522px; height: 108px; display: flex; align-items: center; gap: 22px; }
.hw { font-family: 'Albert Sans', sans-serif; font-weight: 600; font-size: 56px; line-height: 1; letter-spacing: -0.02em; color: #FFFFFF; white-space: nowrap; }
.hw.small { font-size: 46px; }
.foot svg { flex: none; }

/* ---------- The five products, each in its own look ---------- */
/* Rumi Español */
.rumi { background: linear-gradient(160deg, #7B3FE4, #E0409A); color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
.rumi .name { font-weight: 900; font-size: 128px; line-height: 0.95; letter-spacing: -0.02em; }
.rumi .sub { font-weight: 800; font-size: 40px; margin-top: 26px; }
.rumi svg { width: 330px; height: 330px; flex: none; }

/* Roam */
.roam { background: #FFFFFF; justify-content: flex-start; }
.roam .word { display: block; width: 470px; height: auto; margin-left: -10px; }
.roam .bar { width: 200px; height: 10px; border-radius: 5px; background: #35836F; margin-top: 18px; }
.roam .line { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-weight: 400; font-size: 28px; letter-spacing: 0.2em; color: #6F665B; margin-top: 40px; }

/* Gut Check */
.gut { background: #FFFFFF; color: #0F1B2D; font-family: 'Inter', sans-serif; }
.gut .name { font-weight: 600; font-size: 150px; line-height: 0.95; letter-spacing: -0.03em; }
.gut svg { width: 400px; height: 330px; flex: none; }

/* Revenge or Justice */
.rj { background: #FFFFFF; color: #0F1B2D; font-family: 'Albert Sans', sans-serif; }
.rj .name { font-weight: 600; font-size: 124px; line-height: 1.0; letter-spacing: -0.02em; }
.rj .name span { color: #996D00; }
.rj svg { width: 340px; height: 320px; flex: none; }

/* The Undo List */
.undo { background: #FFFFFF; color: #0F1B2D; font-family: 'Inter', sans-serif; }
.undo .label { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.14em; text-transform: uppercase; color: #996D00; margin-bottom: 22px; }
.undo .name { font-weight: 800; font-size: 124px; line-height: 0.95; letter-spacing: -0.03em; }
.undo svg { width: 373px; height: 157px; flex: none; }
</style>

  <div id="treatments"></div>
</main>
